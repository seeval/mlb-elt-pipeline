name: Daily MLB Extraction Pipeline

on:
  schedule:
    - cron: "0 14 * * *"  # 9AM ET daily 
  workflow_dispatch:       # keep manual trigger for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID}}

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync

      - name: Run extraction pipeline
        run: uv run python -m extraction.pipeline

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          mlb_dbt:
            outputs:
              dev:
                type: bigquery
                method: service-account-json
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: mlb_staging
                threads: 4
                location: us-central1
                keyfile_json:
                  type: service_account
                  project_id: ${{ secrets.GCP_PROJECT_ID }}
                  private_key_id: ${{ secrets.GCP_SA_KEY_ID }}
                  private_key: ${{ secrets.GCP_SA_PRIVATE_KEY }}
                  client_email: ${{ secrets.GCP_SA_CLIENT_EMAIL }}
                  client_id: ${{ secrets.GCP_SA_CLIENT_ID }}
                  auth_uri: https://accounts.google.com/o/oauth2/auth
                  token_uri: https://oauth2.googleapis.com/token
            target: dev
          EOF

      - name: Run dbt
        working-directory: mlb_dbt
        run: |
          uv run dbt deps
          uv run dbt run
          uv run dbt test

